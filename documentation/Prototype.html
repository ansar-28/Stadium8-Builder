  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading Transaction Management...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{.sk{animation:none}}\n.ovl{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}\n.dlg{background:#1c2229;border:1px solid #4b535c;border-radius:10px;max-width:520px;width:100%;padding:24px;box-shadow:0 10px 15px -3px rgba(0,0,0,.5)}\n.dlg h2{font-size:20px;font-weight:600;margin-bottom:8px}\n.dlg ul{margin:8px 0;padding-left:20px;color:#EBEFF4}\n.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}\n.err{color:#f87171;font-size:13px;margin-top:6px}\n.final{color:#fbbf24;font-weight:600;font-size:13px}\n.toast{position:fixed;right:20px;bottom:20px;background:#1c2229;border:1px solid #4b535c;border-left:4px solid #2868AD;padding:12px 16px;border-radius:8px;max-width:420px;z-index:60;box-shadow:0 10px 15px -3px rgba(0,0,0,.5)}\n.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 500px at 20% 0,#0f2740,transparent),#0C1015}\n.lc{width:100%;max-width:400px;background:#161B21;border:1px solid #2e353d;border-radius:10px;padding:32px}\n.lc h1{font-size:26px;margin-bottom:4px}\n.lc .sub{color:#9A9FA5;font-size:13px;margin:0 0 20px}\n.stack{display:flex;flex-direction:column;gap:14px}\n.hint{font-size:12px;color:#9A9FA5;margin-top:16px;border-top:1px solid #2e353d;padding-top:12px}\n.banner{border:1px solid #4b535c;background:#1c2229;border-radius:8px;padding:12px 14px;font-size:13px;color:#EBEFF4;margin-bottom:12px}\n.banner.bad{border-color:#f87171}\n.banner.good{border-color:#4ade80}\n.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}\n.lock{color:#9A9FA5;font-size:11px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-canvas-width=\"1360\" data-canvas-height=\"960\" data-document-role=\"page\" data-label=\"Transaction Management\">\n\n<sc-if value=\"{{isLogin}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"login\">\n  <form class=\"lc\" sc-camel-on-submit=\"{{doLogin}}\">\n    <h1>Transaction Management<\u002Fh1>\n    <p class=\"sub\">Sign in to review, decide and export transactions.<\u002Fp>\n    <div class=\"stack\">\n      <div class=\"fld\"><label for=\"u\">Username<\u002Flabel><input class=\"inp\" id=\"u\" type=\"text\" autocomplete=\"off\" value=\"{{uname}}\" sc-camel-on-change=\"{{setUname}}\"><\u002Fdiv>\n      <div class=\"fld\"><label for=\"p\">Password<\u002Flabel><input class=\"inp\" id=\"p\" type=\"text\" autocomplete=\"off\" value=\"{{pwd}}\" sc-camel-on-change=\"{{setPwd}}\"><\u002Fdiv>\n      <sc-if value=\"{{loginErr}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err\" role=\"alert\">{{loginErr}}<\u002Fdiv><\u002Fsc-if>\n      <button class=\"btn p\" type=\"submit\">Sign in<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"hint\">Prototype accounts, password <b>demo<\u002Fb>:<br><button type=\"button\" class=\"btn\" style=\"margin:6px 6px 0 0;padding:4px 10px;min-height:32px\" sc-camel-on-click=\"{{fillCarol}}\">carol · File Importer<\u002Fbutton><button type=\"button\" class=\"btn\" style=\"margin:6px 6px 0 0;padding:4px 10px;min-height:32px\" sc-camel-on-click=\"{{fillBob}}\">bob · Approver<\u002Fbutton><button type=\"button\" class=\"btn\" style=\"margin:6px 0 0;padding:4px 10px;min-height:32px\" sc-camel-on-click=\"{{fillAlice}}\">alice · both roles<\u002Fbutton><\u002Fdiv>\n  <\u002Fform>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{isApp}}\" hint-placeholder-val=\"{{ false }}\">\n<header class=\"hdr\">\n  <span class=\"brand\">Transaction Management<\u002Fspan>\n  <nav class=\"nav\" aria-label=\"Main\">\n    <button class=\"{{navTx}}\" sc-camel-on-click=\"{{goTx}}\">Transactions<\u002Fbutton>\n    <button class=\"{{navFl}}\" sc-camel-on-click=\"{{goFl}}\">Files<\u002Fbutton>\n    <sc-if value=\"{{isImp}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"{{navUp}}\" sc-camel-on-click=\"{{goUp}}\">Upload<\u002Fbutton><\u002Fsc-if>\n    <button class=\"{{navEx}}\" sc-camel-on-click=\"{{goEx}}\">Export<\u002Fbutton>\n  <\u002Fnav>\n  <div class=\"who\">\n    <span>{{userName}}<\u002Fspan>\n    <sc-for list=\"{{userRoles}}\" as=\"r\" hint-placeholder-count=\"2\"><span class=\"role\">{{r}}<\u002Fspan><\u002Fsc-for>\n    <button class=\"btn g\" sc-camel-on-click=\"{{doSignOut}}\">{{signOutLabel}}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main>\n\n<!-- TRANSACTIONS -->\n<sc-if value=\"{{vTx}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"ph\"><div><h1>Transactions<\u002Fh1><p>Transaction data is read-only. Decisions are final.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"card\">\n  <div class=\"filters\">\n    <div class=\"fld\"><label for=\"tf1\">Date from<\u002Flabel><input id=\"tf1\" type=\"date\" value=\"{{tx.f.from}}\" sc-camel-on-change=\"{{tx.on.from}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"tf2\">Date to<\u002Flabel><input id=\"tf2\" type=\"date\" value=\"{{tx.f.to}}\" sc-camel-on-change=\"{{tx.on.to}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"tf3\">Account number<\u002Flabel><input id=\"tf3\" type=\"text\" placeholder=\"1001-2034\" value=\"{{tx.f.acct}}\" sc-camel-on-change=\"{{tx.on.acct}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"tf4\">Amount min<\u002Flabel><input id=\"tf4\" type=\"number\" style=\"width:110px\" value=\"{{tx.f.min}}\" sc-camel-on-change=\"{{tx.on.min}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"tf5\">Amount max<\u002Flabel><input id=\"tf5\" type=\"number\" style=\"width:110px\" value=\"{{tx.f.max}}\" sc-camel-on-change=\"{{tx.on.max}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"tf6\">Transaction type<\u002Flabel><sc-raw-select id=\"tf6\" value=\"{{tx.f.type}}\" sc-camel-on-change=\"{{tx.on.type}}\"><option value=\"\">Any<\u002Foption><option value=\"Credit\">Credit<\u002Foption><option value=\"Debit\">Debit<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n    <div class=\"fld\"><label for=\"tf7\">Currency<\u002Flabel><sc-raw-select id=\"tf7\" value=\"{{tx.f.cur}}\" sc-camel-on-change=\"{{tx.on.cur}}\"><option value=\"\">Any<\u002Foption><option value=\"ZAR\">ZAR<\u002Foption><option value=\"USD\">USD<\u002Foption><option value=\"EUR\">EUR<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n    <button class=\"btn\" sc-camel-on-click=\"{{tx.clear}}\">Clear all<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{tx.hasSel}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"bulk\" role=\"region\" aria-label=\"Bulk actions\">\n  <b>{{tx.selLabel}}<\u002Fb>\n  <button class=\"btn p\" sc-camel-on-click=\"{{tx.bulkApprove}}\">Approve selected<\u002Fbutton>\n  <button class=\"btn d\" sc-camel-on-click=\"{{tx.bulkReject}}\">Reject selected<\u002Fbutton>\n  <button class=\"btn\" sc-camel-on-click=\"{{tx.clearSel}}\">Clear selection<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{loading}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"tw\" style=\"padding:16px\" aria-busy=\"true\"><div class=\"sk\" style=\"width:100%;margin-bottom:16px\"><\u002Fdiv><div class=\"sk\" style=\"width:90%;margin-bottom:16px\"><\u002Fdiv><div class=\"sk\" style=\"width:95%;margin-bottom:16px\"><\u002Fdiv><div class=\"sk\" style=\"width:80%;margin-bottom:16px\"><\u002Fdiv><div class=\"sk\" style=\"width:92%\"><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{tx.show}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"tw\">\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr>\n  <sc-if value=\"{{canDecide}}\" hint-placeholder-val=\"{{ true }}\">\n    <sc-raw-th class=\"pl\" style=\"width:40px\"><input class=\"cb sm\" type=\"checkbox\" aria-label=\"Select all pending transactions on this page\" checked=\"{{tx.allSel}}\" sc-camel-on-change=\"{{tx.toggleAll}}\"><\u002Fsc-raw-th>\n    <sc-raw-th class=\"pl\" style=\"width:84px\" aria-label=\"Row actions\"><\u002Fsc-raw-th>\n  <\u002Fsc-if>\n  <sc-for list=\"{{tx.heads}}\" as=\"h\" hint-placeholder-count=\"9\"><sc-raw-th aria-sort=\"{{h.aria}}\"><button class=\"{{h.cls}}\" sc-camel-on-click=\"{{h.sort}}\">{{h.label}}<span aria-hidden=\"true\">{{h.arrow}}<\u002Fspan><\u002Fbutton><\u002Fsc-raw-th><\u002Fsc-for>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{tx.rows}}\" as=\"row\" hint-placeholder-count=\"5\">\n<sc-raw-tr class=\"{{row.trCls}}\">\n  <sc-if value=\"{{canDecide}}\" hint-placeholder-val=\"{{ true }}\">\n    <sc-raw-td><input class=\"cb sm\" type=\"checkbox\" aria-label=\"{{row.selLabel}}\" title=\"{{row.selTitle}}\" checked=\"{{row.sel}}\" disabled=\"{{row.selDisabled}}\" sc-camel-on-change=\"{{row.toggle}}\"><\u002Fsc-raw-td>\n    <sc-raw-td>\n      <sc-if value=\"{{row.pending}}\" hint-placeholder-val=\"{{ true }}\">\n        <button class=\"{{row.apCls}}\" aria-label=\"{{row.apLabel}}\" title=\"{{row.apTitle}}\" sc-camel-on-click=\"{{row.approve}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fbutton><button class=\"{{row.rjCls}}\" aria-label=\"{{row.rjLabel}}\" title=\"{{row.rjTitle}}\" sc-camel-on-click=\"{{row.reject}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsc-raw-td>\n  <\u002Fsc-if>\n  <sc-raw-td class=\"mono\">{{row.ref}}<\u002Fsc-raw-td>\n  <sc-raw-td class=\"mono\">{{row.date}}<\u002Fsc-raw-td>\n  <sc-raw-td class=\"mono\">{{row.acct}}<\u002Fsc-raw-td>\n  <sc-raw-td>{{row.desc}}<\u002Fsc-raw-td>\n  <sc-raw-td class=\"mono r\">{{row.amount}}<\u002Fsc-raw-td>\n  <sc-raw-td><span class=\"{{row.typeCls}}\">{{row.type}}<\u002Fspan><\u002Fsc-raw-td>\n  <sc-raw-td>{{row.cur}}<\u002Fsc-raw-td>\n  <sc-raw-td><span class=\"{{row.stCls}}\">{{row.status}}<\u002Fspan><sc-if value=\"{{row.hasNote}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"note\">Reason: {{row.note}}<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td>\n  <sc-raw-td class=\"mono\">{{row.days}}<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{tx.noData}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"tw\"><div class=\"empty\"><strong>No transactions yet<\u002Fstrong>Transactions appear here once a file has been uploaded.<sc-if value=\"{{isImp}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:14px\"><button class=\"btn p\" sc-camel-on-click=\"{{goUp}}\">Upload a file<\u002Fbutton><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{tx.noMatch}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"tw\"><div class=\"empty\"><strong>No transactions match these filters<\u002Fstrong>Active filters:\n<div class=\"fchips\"><sc-for list=\"{{tx.active}}\" as=\"a\" hint-placeholder-count=\"2\"><span class=\"fchip\">{{a}}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<button class=\"btn p\" sc-camel-on-click=\"{{tx.clear}}\">Clear all<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<div class=\"ft\">\n  <span>{{tx.count}}<\u002Fspan>\n  <div class=\"pg\">\n    <label for=\"tps\">Rows per page<\u002Flabel>\n    <sc-raw-select id=\"tps\" value=\"{{tx.pg.size}}\" sc-camel-on-change=\"{{tx.pg.setSize}}\"><option value=\"5\">5<\u002Foption><option value=\"10\">10<\u002Foption><option value=\"20\">20<\u002Foption><option value=\"50\">50<\u002Foption><\u002Fsc-raw-select>\n    <button class=\"btn\" disabled=\"{{tx.pg.prevDis}}\" sc-camel-on-click=\"{{tx.pg.prev}}\">Previous<\u002Fbutton>\n    <span>{{tx.pg.label}}<\u002Fspan>\n    <button class=\"btn\" disabled=\"{{tx.pg.nextDis}}\" sc-camel-on-click=\"{{tx.pg.next}}\">Next<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- FILES -->\n<sc-if value=\"{{vFl}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"ph\"><div><h1>Uploaded files<\u002Fh1><p>Every successfully uploaded .csv file, with its upload timestamp.<\u002Fp><\u002Fdiv>\n<sc-if value=\"{{isImp}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn p\" sc-camel-on-click=\"{{goUp}}\">Upload a file<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n<sc-if value=\"{{fl.show}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"tw\"><sc-raw-table style=\"min-width:560px\"><sc-raw-thead><sc-raw-tr><sc-raw-th class=\"pl\">File name<\u002Fsc-raw-th><sc-raw-th class=\"pl\">Upload timestamp<\u002Fsc-raw-th><sc-raw-th class=\"pl\" style=\"width:140px\"><span style=\"position:absolute;left:-9999px\">Download<\u002Fspan><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody><sc-for list=\"{{fl.rows}}\" as=\"f\" hint-placeholder-count=\"3\"><sc-raw-tr><sc-raw-td>{{f.name}}<\u002Fsc-raw-td><sc-raw-td class=\"mono\">{{f.date}}<\u002Fsc-raw-td><sc-raw-td><button class=\"btn\" aria-label=\"{{f.label}}\" sc-camel-on-click=\"{{f.download}}\">Download<\u002Fbutton><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{fl.empty}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"tw\"><div class=\"empty\"><strong>No files yet<\u002Fstrong><sc-if value=\"{{isImp}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:14px\"><button class=\"btn p\" sc-camel-on-click=\"{{goUp}}\">Upload a file<\u002Fbutton><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<div class=\"ft\"><span>{{fl.count}}<\u002Fspan>\n  <div class=\"pg\"><label for=\"fps\">Rows per page<\u002Flabel>\n    <sc-raw-select id=\"fps\" value=\"{{fl.pg.size}}\" sc-camel-on-change=\"{{fl.pg.setSize}}\"><option value=\"5\">5<\u002Foption><option value=\"10\">10<\u002Foption><option value=\"20\">20<\u002Foption><option value=\"50\">50<\u002Foption><\u002Fsc-raw-select>\n    <button class=\"btn\" disabled=\"{{fl.pg.prevDis}}\" sc-camel-on-click=\"{{fl.pg.prev}}\">Previous<\u002Fbutton><span>{{fl.pg.label}}<\u002Fspan><button class=\"btn\" disabled=\"{{fl.pg.nextDis}}\" sc-camel-on-click=\"{{fl.pg.next}}\">Next<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- UPLOAD -->\n<sc-if value=\"{{vUp}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"ph\"><div><h1>Upload transaction file<\u002Fh1><p>Only the seven-column .csv layout is accepted: Reference, TransactionDate, AccountNumber, Description, Amount, TransactionType, Currency.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"card\" style=\"max-width:640px\">\n  <div class=\"stack\">\n    <div class=\"fld\"><label for=\"fi\">Choose a .csv file<\u002Flabel><input class=\"inp\" id=\"fi\" type=\"file\" accept=\".csv\" sc-camel-on-change=\"{{pickFile}}\"><\u002Fdiv>\n    <sc-if value=\"{{upName}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px\">Selected: <b>{{upName}}<\u002Fb><\u002Fdiv><\u002Fsc-if>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <button class=\"btn p\" sc-camel-on-click=\"{{submitUpload}}\">Upload file<\u002Fbutton>\n      <button class=\"btn\" sc-camel-on-click=\"{{useValid}}\">Use a valid sample<\u002Fbutton>\n      <button class=\"btn\" sc-camel-on-click=\"{{useInvalid}}\">Use an invalid sample<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{upMsg}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"{{upCls}}\" role=\"status\">{{upMsg}}<\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- EXPORT -->\n<sc-if value=\"{{vEx}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"ph\"><div><h1>Export actioned transactions<\u002Fh1><p>Approved and rejected transactions only. The .csv uses the import layout plus a Status field.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"card\">\n  <h3 style=\"font-size:16px;font-weight:600;margin-bottom:10px\">Quick export<\u002Fh3>\n  <div class=\"filters\">\n    <div class=\"fld\"><label for=\"qp\">Period<\u002Flabel><sc-raw-select id=\"qp\" value=\"{{quickP}}\" sc-camel-on-change=\"{{setQuickP}}\"><option value=\"day\">Day<\u002Foption><option value=\"week\">Week<\u002Foption><option value=\"month\">Month<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n    <div class=\"fld\"><label for=\"qd\">Decision<\u002Flabel><sc-raw-select id=\"qd\" value=\"{{quickD}}\" sc-camel-on-change=\"{{setQuickD}}\"><option value=\"both\">Approved and rejected<\u002Foption><option value=\"Approved\">Approved<\u002Foption><option value=\"Rejected\">Rejected<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n    <button class=\"btn p\" sc-camel-on-click=\"{{quickExport}}\">Quick export<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\">\n  <div class=\"filters\">\n    <div class=\"fld\"><label for=\"ef0\">Approval state<\u002Flabel><sc-raw-select id=\"ef0\" value=\"{{ex.f.state}}\" sc-camel-on-change=\"{{ex.on.state}}\"><option value=\"\">Approved and rejected<\u002Foption><option value=\"Approved\">Approved<\u002Foption><option value=\"Rejected\">Rejected<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n    <div class=\"fld\"><label for=\"ef1\">Date from<\u002Flabel><input id=\"ef1\" type=\"date\" value=\"{{ex.f.from}}\" sc-camel-on-change=\"{{ex.on.from}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"ef2\">Date to<\u002Flabel><input id=\"ef2\" type=\"date\" value=\"{{ex.f.to}}\" sc-camel-on-change=\"{{ex.on.to}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"ef3\">Account number<\u002Flabel><input id=\"ef3\" type=\"text\" value=\"{{ex.f.acct}}\" sc-camel-on-change=\"{{ex.on.acct}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"ef4\">Amount min<\u002Flabel><input id=\"ef4\" type=\"number\" style=\"width:110px\" value=\"{{ex.f.min}}\" sc-camel-on-change=\"{{ex.on.min}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"ef5\">Amount max<\u002Flabel><input id=\"ef5\" type=\"number\" style=\"width:110px\" value=\"{{ex.f.max}}\" sc-camel-on-change=\"{{ex.on.max}}\"><\u002Fdiv>\n    <div class=\"fld\"><label for=\"ef6\">Transaction type<\u002Flabel><sc-raw-select id=\"ef6\" value=\"{{ex.f.type}}\" sc-camel-on-change=\"{{ex.on.type}}\"><option value=\"\">Any<\u002Foption><option value=\"Credit\">Credit<\u002Foption><option value=\"Debit\">Debit<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n    <button class=\"btn\" sc-camel-on-click=\"{{ex.clear}}\">Clear all<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"bulk\"><b>{{ex.selLabel}}<\u002Fb><button class=\"btn p\" disabled=\"{{ex.noSel}}\" sc-camel-on-click=\"{{exportSelected}}\">Export selected<\u002Fbutton><button class=\"btn\" disabled=\"{{ex.noSel}}\" sc-camel-on-click=\"{{ex.clearSel}}\">Clear selection<\u002Fbutton><\u002Fdiv>\n<sc-if value=\"{{ex.show}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"tw\"><sc-raw-table><sc-raw-thead><sc-raw-tr>\n  <sc-raw-th class=\"pl\" style=\"width:40px\"><input class=\"cb\" type=\"checkbox\" aria-label=\"Select all transactions on this page\" checked=\"{{ex.allSel}}\" sc-camel-on-change=\"{{ex.toggleAll}}\"><\u002Fsc-raw-th>\n  <sc-for list=\"{{ex.heads}}\" as=\"h\" hint-placeholder-count=\"8\"><sc-raw-th aria-sort=\"{{h.aria}}\"><button class=\"{{h.cls}}\" sc-camel-on-click=\"{{h.sort}}\">{{h.label}}<span aria-hidden=\"true\">{{h.arrow}}<\u002Fspan><\u002Fbutton><\u002Fsc-raw-th><\u002Fsc-for>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n<sc-for list=\"{{ex.rows}}\" as=\"row\" hint-placeholder-count=\"5\">\n<sc-raw-tr class=\"{{row.trCls}}\">\n  <sc-raw-td><input class=\"cb\" type=\"checkbox\" aria-label=\"{{row.selLabel}}\" checked=\"{{row.sel}}\" sc-camel-on-change=\"{{row.toggle}}\"><\u002Fsc-raw-td>\n  <sc-raw-td class=\"mono\">{{row.ref}}<\u002Fsc-raw-td><sc-raw-td class=\"mono\">{{row.date}}<\u002Fsc-raw-td><sc-raw-td class=\"mono\">{{row.acct}}<\u002Fsc-raw-td><sc-raw-td>{{row.desc}}<\u002Fsc-raw-td><sc-raw-td class=\"mono r\">{{row.amount}}<\u002Fsc-raw-td>\n  <sc-raw-td><span class=\"{{row.typeCls}}\">{{row.type}}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>{{row.cur}}<\u002Fsc-raw-td>\n  <sc-raw-td><span class=\"{{row.stCls}}\">{{row.status}}<\u002Fspan><sc-if value=\"{{row.hasNote}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"note\">Reason: {{row.note}}<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td>\n<\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ex.empty}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"tw\"><div class=\"empty\"><strong>Nothing is available to export<\u002Fstrong>Change the filters to see approved or rejected transactions. Pending transactions are never offered.<div style=\"margin-top:14px\"><button class=\"btn p\" sc-camel-on-click=\"{{ex.clear}}\">Clear all<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<div class=\"ft\"><span>{{ex.count}}<\u002Fspan>\n  <div class=\"pg\"><label for=\"eps\">Rows per page<\u002Flabel>\n    <sc-raw-select id=\"eps\" value=\"{{ex.pg.size}}\" sc-camel-on-change=\"{{ex.pg.setSize}}\"><option value=\"5\">5<\u002Foption><option value=\"10\">10<\u002Foption><option value=\"20\">20<\u002Foption><option value=\"50\">50<\u002Foption><\u002Fsc-raw-select>\n    <button class=\"btn\" disabled=\"{{ex.pg.prevDis}}\" sc-camel-on-click=\"{{ex.pg.prev}}\">Previous<\u002Fbutton><span>{{ex.pg.label}}<\u002Fspan><button class=\"btn\" disabled=\"{{ex.pg.nextDis}}\" sc-camel-on-click=\"{{ex.pg.next}}\">Next<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<!-- DIALOGS -->\n<sc-if value=\"{{m.isConfirm}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"ovl\"><div class=\"dlg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mt\">\n  <h2 id=\"mt\">{{m.title}}<\u002Fh2>\n  <ul><sc-for list=\"{{m.names}}\" as=\"n\" hint-placeholder-count=\"3\"><li class=\"mono\">{{n}}<\u002Fli><\u002Fsc-for><\u002Ful>\n  <sc-if value=\"{{m.isReject}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"fld\" style=\"margin-top:12px\"><label for=\"rr\">{{m.reasonLabel}}<\u002Flabel><textarea class=\"inp\" id=\"rr\" rows=\"3\" value=\"{{reason}}\" sc-camel-on-change=\"{{setReason}}\"><\u002Ftextarea><\u002Fdiv>\n    <sc-if value=\"{{modalErr}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err\" role=\"alert\">{{modalErr}}<\u002Fdiv><\u002Fsc-if>\n  <\u002Fsc-if>\n  <p class=\"final\">This decision is final.<\u002Fp>\n  <div class=\"acts\"><button class=\"btn\" id=\"cancel-btn\" sc-camel-on-click=\"{{closeModal}}\">Cancel<\u002Fbutton><button class=\"{{m.okCls}}\" sc-camel-on-click=\"{{confirmDecision}}\">{{m.okLabel}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{m.isBlocked}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"ovl\"><div class=\"dlg\" role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"bt\">\n  <h2 id=\"bt\">{{m.blockTitle}}<\u002Fh2>\n  <p style=\"margin:0 0 6px\">{{m.blockText}}<\u002Fp>\n  <ul><sc-for list=\"{{m.names}}\" as=\"n\" hint-placeholder-count=\"2\"><li class=\"mono\">{{n}}<\u002Fli><\u002Fsc-for><\u002Ful>\n  <p style=\"color:#9A9FA5;font-size:13px;margin:8px 0 0\">{{m.blockHelp}}<\u002Fp>\n  <div class=\"acts\"><button class=\"btn p\" id=\"cancel-btn\" sc-camel-on-click=\"{{closeModal}}\">Close<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"toast\" role=\"status\" aria-live=\"polite\">{{toast}}<\u002Fdiv><\u002Fsc-if>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:960}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.TODAY = '2026-04-16';\n    const files = [\n      { id: 101, name: 'transactions_2026-04-14.csv', date: '2026-04-14 07:58', by: 'alice' },\n      { id: 102, name: 'transactions_2026-04-15.csv', date: '2026-04-15 08:20', by: 'carol' },\n      { id: 103, name: 'transactions_2026-04-16.csv', date: '2026-04-16 09:05', by: 'carol' }\n    ];\n    const descs = ['Monthly premium', 'Supplier payment', 'Salary run', 'Refund', 'Card settlement', 'Utility payment', 'Invoice 4471', 'Wire transfer', 'Claim payout', 'Subscription', 'Fuel account', 'Equipment lease'];\n    const accts = ['1001-2034-5567', '1001-2034-5568', '2210-7781-0042', '3305-1120-9981'];\n    const curs = ['ZAR', 'ZAR', 'ZAR', 'USD', 'ZAR', 'EUR'];\n    const txns = [];\n    for (let i = 0; i < 36; i++) {\n      const f = files[i % 3];\n      const day = 16 - (i % 8);\n      const hh = 8 + (i * 7) % 10, mm = (i * 13) % 60;\n      const d = '2026-04-' + String(day).padStart(2, '0') + ' ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');\n      let status = 'Pending', note = '';\n      if (i < 18) {\n        if (i % 3 === 1) { status = 'Rejected'; note = ['Amount does not match invoice', 'Duplicate of an earlier entry', 'Account not recognised'][i % 3 === 1 ? (i % 9) / 3 | 0 : 0]; }\n        else status = 'Approved';\n      }\n      txns.push({ id: 5000 + i, fileId: f.id, ref: 'TXN-' + f.date.slice(0, 10).replace(/-/g, '') + '-' + String(Math.floor(i / 3) + 1).padStart(4, '0'), date: d, acct: accts[i % 4], desc: descs[i % 12], amount: Math.round((120 + ((i * 7919) % 48000)) * 100) / 100 + (i % 5) * 0.35, type: i % 3 === 0 ? 'Debit' : 'Credit', cur: curs[i % 6], status, note });\n    }\n    this.state = {\n      screen: 'login', user: null, uname: '', pwd: '', loginErr: '', view: 'transactions', loading: false, signingOut: false,\n      files, txns,\n      txF: { from: '', to: '', acct: '', min: '', max: '', type: '', cur: '' }, txSort: { k: 'date', d: 'desc' }, txPage: 1, txSize: 20,\n      exF: { state: '', from: '', to: '', acct: '', min: '', max: '', type: '' }, exSort: { k: 'date', d: 'desc' }, exPage: 1, exSize: 20,\n      flPage: 1, flSize: 20, sel: {}, exSel: {}, modal: null, reason: '', modalErr: '', toast: '',\n      quickP: 'day', quickD: 'both', upName: '', upMsg: '', upOk: null\n    };\n  }\n  fmtAmt(n) { return n.toFixed(2).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' '); }\n  note(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._tt);\n    this._tt = setTimeout(() => this.setState({ toast: '' }), 4500);\n  }\n  roles() { return this.state.user ? this.state.user.roles : []; }\n  isImp() { return this.roles().indexOf('File Importer') >= 0; }\n  isApp() { return this.roles().indexOf('Approver') >= 0; }\n  go(view) {\n    const loading = view === 'transactions';\n    this.setState({ view, loading, sel: {}, exSel: {}, upMsg: '' });\n    if (loading) { clearTimeout(this._lt); this._lt = setTimeout(() => this.setState({ loading: false }), 600); }\n  }\n  login(name) {\n    const u = { carol: ['Carol Mokoena', ['File Importer']], bob: ['Bob Naidoo', ['Approver']], alice: ['Alice Jacobs', ['File Importer', 'Approver']] }[name.trim().toLowerCase()];\n    return u ? { username: name.trim().toLowerCase(), name: u[0], roles: u[1] } : null;\n  }\n  doLogin(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    const s = this.state;\n    if (!s.uname.trim() || !s.pwd.trim()) { this.setState({ loginErr: 'Username and password are required.' }); return; }\n    const u = s.pwd === 'demo' ? this.login(s.uname) : null;\n    if (!u) { this.setState({ loginErr: 'Sign-in failed. Check your details and try again.' }); return; }\n    this.setState({ screen: 'app', user: u, loginErr: '', view: 'transactions', loading: true });\n    this._lt = setTimeout(() => this.setState({ loading: false }), 600);\n  }\n  signOut() {\n    this.setState({ signingOut: true });\n    setTimeout(() => this.setState({ signingOut: false, screen: 'login', user: null, pwd: '', sel: {}, exSel: {}, modal: null, toast: '' }), 700);\n  }\n  pager(kind, total) {\n    const s = this.state, size = s[kind + 'Size'];\n    const pages = Math.max(1, Math.ceil(total / size)), page = Math.min(s[kind + 'Page'], pages);\n    return {\n      size, page, pages, from: (page - 1) * size,\n      pg: {\n        size: String(size), label: 'Page ' + page + ' of ' + pages, prevDis: page <= 1, nextDis: page >= pages,\n        prev: () => this.setState({ [kind + 'Page']: page - 1 }), next: () => this.setState({ [kind + 'Page']: page + 1 }),\n        setSize: (e) => this.setState({ [kind + 'Size']: parseInt(e.target.value, 10), [kind + 'Page']: 1 })\n      }\n    };\n  }\n  matches(t, f) {\n    const d = t.date.slice(0, 10);\n    if (f.state && t.status !== f.state) return false;\n    if (f.from && d < f.from) return false;\n    if (f.to && d > f.to) return false;\n    if (f.acct && t.acct.indexOf(f.acct.trim()) < 0) return false;\n    if (f.min !== '' && t.amount < parseFloat(f.min)) return false;\n    if (f.max !== '' && t.amount > parseFloat(f.max)) return false;\n    if (f.type && t.type !== f.type) return false;\n    if (f.cur && t.cur !== f.cur) return false;\n    return true;\n  }\n  daysPending(t) {\n    if (t.status !== 'Pending') return -1;\n    const f = this.state.files.find(x => x.id === t.fileId);\n    return Math.round((Date.parse(this.TODAY) - Date.parse(f.date.slice(0, 10))) / 86400000);\n  }\n  sortRows(rows, sort) {\n    const k = sort.k, dir = sort.d === 'asc' ? 1 : -1;\n    const val = (t) => ({ ref: t.ref, date: t.date, acct: t.acct, desc: t.desc, amount: t.amount, type: t.type, cur: t.cur, status: t.status, days: this.daysPending(t) })[k];\n    return rows.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });\n  }\n  buildList(kind) {\n    const s = this.state, isTx = kind === 'tx';\n    const base = isTx ? s.txns : s.txns.filter(t => t.status !== 'Pending');\n    const fKey = isTx ? 'txF' : 'exF', sKey = isTx ? 'txSort' : 'exSort', selKey = isTx ? 'sel' : 'exSel', pKey = isTx ? 'tx' : 'ex';\n    const f = s[fKey];\n    const filtered = this.sortRows(base.filter(t => this.matches(t, f)), s[sKey]);\n    const pr = this.pager(pKey, filtered.length);\n    const page = filtered.slice(pr.from, pr.from + pr.size);\n    const sel = s[selKey];\n    const own = (t) => { const fl = s.files.find(x => x.id === t.fileId); return s.user && fl.by === s.user.username; };\n    const cols = isTx\n      ? [['ref', 'Reference'], ['date', 'Date'], ['acct', 'Account number'], ['desc', 'Description'], ['amount', 'Amount', 1], ['type', 'Type'], ['cur', 'Currency'], ['status', 'Status'], ['days', 'Days pending']]\n      : [['ref', 'Reference'], ['date', 'Date'], ['acct', 'Account number'], ['desc', 'Description'], ['amount', 'Amount', 1], ['type', 'Type'], ['cur', 'Currency'], ['status', 'Status']];\n    const heads = cols.map(c => {\n      const on = s[sKey].k === c[0];\n      return { label: c[1], cls: c[2] ? 'r' : '', arrow: on ? (s[sKey].d === 'asc' ? ' ▲' : ' ▼') : '', aria: on ? (s[sKey].d === 'asc' ? 'ascending' : 'descending') : 'none',\n        sort: () => this.setState({ [sKey]: { k: c[0], d: on && s[sKey].d === 'asc' ? 'desc' : 'asc' }, [pKey + 'Page']: 1 }) };\n    });\n    const selectable = (t) => isTx ? t.status === 'Pending' : true;\n    const rows = page.map(t => {\n      const pending = t.status === 'Pending', blocked = own(t);\n      const dim = blocked ? ' dim' : '';\n      return {\n        ref: t.ref, date: t.date, acct: t.acct, desc: t.desc, amount: this.fmtAmt(t.amount), type: t.type, typeCls: 'chip c-' + t.type.toLowerCase(), cur: t.cur,\n        status: t.status, stCls: 'chip c-' + t.status.toLowerCase(), note: t.note, hasNote: !!t.note,\n        days: pending ? this.daysPending(t) + (this.daysPending(t) === 1 ? ' day' : ' days') : '—',\n        pending, trCls: sel[t.id] ? 'sel' : '', sel: !!sel[t.id], selDisabled: !selectable(t),\n        selLabel: 'Select ' + t.ref, selTitle: selectable(t) ? '' : t.status + ' — decision is final',\n        toggle: () => { const n = Object.assign({}, sel); if (n[t.id]) delete n[t.id]; else n[t.id] = true; this.setState({ [selKey]: n }); },\n        apCls: 'ic tic
